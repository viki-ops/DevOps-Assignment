---
# ---------------------------------------------------------------------------
# Single source of truth for every pinned version in the platform.
# Nothing anywhere else in this repo may float to "latest".
# ---------------------------------------------------------------------------

# --- Core platform -----------------------------------------------------------
# Kubernetes 1.34.10 is deliberately NOT the newest release (1.36 is current).
# It is the version the kOps stable channel recommends for the 1.34 range, and
# it sits inside the upstream n-2 support window, so it still receives patch
# and CVE fixes. 1.33 would have been more conservative but is already EOL,
# which would mean shipping a cluster that cannot be patched. See
# docs/adr/0001-kubernetes-version.md for the full rationale.
kubernetes_version: "1.34.10"
kops_version: "1.36.2"

# --- Operator toolchain ------------------------------------------------------
terraform_version: "1.16.1"
kubectl_version: "1.34.10"      # kept in lockstep with the cluster version
helm_version: "3.21.4"          # Helm 3, not 4 - ArgoCD 3.5 templates with v3
argocd_version: "3.5.2"
yq_version: "4.53.6"
kubeconform_version: "0.8.0"
tflint_version: "0.64.0"

install_dir: /usr/local/bin

# --- AWS / environment -------------------------------------------------------
aws_region: "eu-north-1"
aws_account_id: "125788629837"
env: "dev"
project: "platform"

# kOps cluster identity. The ".k8s.local" suffix selects None-DNS topology,
# so no public Route53 zone (and therefore no registered domain) is required:
# kOps writes the API Network Load Balancer hostname straight into kubeconfig.
cluster_name: "dev.k8s.local"
kops_state_store: "s3://platform-dev-kops-state-125788629837"

# Terraform stack whose outputs feed the kOps cluster manifest.
terraform_live_dir: "../infra-live/dev"
