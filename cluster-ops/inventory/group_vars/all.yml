---
# ---------------------------------------------------------------------------
# Single source of truth for every pinned version in the platform.
# Nothing anywhere else in this repo may float to "latest".
# ---------------------------------------------------------------------------

# --- Core platform -----------------------------------------------------------
# Kubernetes 1.34.10 is deliberately NOT the newest release (1.36 is current).
# It is the version the kOps stable channel recommends for the 1.34 range, and
# it sits inside the upstream n-2 support window, so it still receives patch
# and CVE fixes. 1.33 would have been more conservative but is already EOL,
# which would mean shipping a cluster that cannot be patched. See
# docs/adr/0001-kubernetes-version.md for the full rationale.
kubernetes_version: "1.34.10"
kops_version: "1.36.2"

# --- Operator toolchain ------------------------------------------------------
terraform_version: "1.16.1"
kubectl_version: "1.34.10"      # kept in lockstep with the cluster version
helm_version: "3.21.4"          # Helm 3, not 4 - ArgoCD 3.5 templates with v3
argocd_version: "3.5.2"

# Chart version is pinned independently of the app version: the argo-helm chart
# and ArgoCD itself release on different cadences, so "latest chart for this
# app version" is not stable over time. 10.8.2 ships appVersion v3.5.2.
argocd_chart_version: "10.8.2"
yq_version: "4.53.6"
kubeconform_version: "0.8.0"
tflint_version: "0.64.0"

install_dir: /usr/local/bin

# --- AWS / environment -------------------------------------------------------
aws_region: "eu-north-1"
aws_account_id: "125788629837"
env: "dev"
project: "platform"

# kOps cluster identity. The ".k8s.local" suffix selects None-DNS topology,
# so no public Route53 zone (and therefore no registered domain) is required:
# kOps writes the API Network Load Balancer hostname straight into kubeconfig.
cluster_name: "dev.k8s.local"

# Created by infra-live/_bootstrap, in eu-north-1 alongside the cluster.
#
# Deliberately NOT the pre-existing platform-dev-kops-state-125788629837: that
# bucket lives in us-west-2 (so every node boot would fetch its configuration
# cross-region, bypassing the S3 gateway endpoint) and its default encryption
# key is pending deletion, which makes writes fail outright.
kops_state_store: "s3://platform-kops-state-eun1-125788629837"

# Terraform stack whose outputs feed the kOps cluster manifest.
#
# Absolute, derived from playbook_dir. Ansible modules do not run with the
# playbook's working directory, so a relative path here fails with a confusing
# "Unable to change directory before execution".
terraform_live_dir: "{{ playbook_dir }}/../../infra-live/dev"

# Where rendered manifests are written before being applied. Gitignored.
kops_build_dir: "{{ playbook_dir }}/../build"

# ---------------------------------------------------------------------------
# Cluster shape
# ---------------------------------------------------------------------------
kops:
  # Three control-plane nodes, one per AZ. Three, not two: etcd needs an odd
  # number to form a quorum, and a 2-node etcd cluster tolerates zero failures
  # while costing more than a single node.
  control_plane:
    machine_type: t3.medium
    volume_size: 32
    volume_type: gp3

  # On-demand workers carry anything that must not be interrupted: ArgoCD,
  # Prometheus, and the ingress controllers. Pinned via a node label the
  # platform chart selects on.
  nodes_ondemand:
    machine_type: t3.large
    min_size: 2
    max_size: 4
    volume_size: 50
    volume_type: gp3

  # Spot workers carry the stateless application replicas. Mixed instance
  # policy across three families so a single capacity pool drying up does not
  # take the group down.
  #
  # t3a.large is deliberately absent: AWS does not offer it in eu-north-1.
  nodes_spot:
    machine_types:
      - t3.large
      - m5.large
      - m6i.large
    min_size: 2
    max_size: 6
    volume_size: 50
    volume_type: gp3
    on_demand_base: 0
    on_demand_above_base_percentage: 0

  bastion:
    machine_type: t3.micro
    volume_size: 16

# ---------------------------------------------------------------------------
# Access control
#
# Both the API server and SSH are locked to the operator's egress address.
# 0.0.0.0/0 would be the easy choice and is a genuine finding - an exposed
# kube-apiserver is one credential leak away from cluster takeover.
#
# If your egress IP changes, re-run cluster-create.yml (it re-detects) or see
# docs/runbooks/provisioning.md for the one-command security group fix.
# ---------------------------------------------------------------------------
kops_api_access_extra_cidrs: []
kops_ssh_access_extra_cidrs: []

