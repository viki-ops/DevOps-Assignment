# The whole kOps lifecycle is driven from the operator workstation (this host).
# kOps talks to AWS and to the cluster API directly, so there is no need to
# inventory the control-plane or worker nodes themselves - they are cattle and
# are never configured by Ansible. The bastion is listed only so that the
# runbook's connectivity checks can target it once the cluster exists.

[controller]
localhost ansible_connection=local

[controller:vars]
ansible_python_interpreter=/usr/bin/python3
