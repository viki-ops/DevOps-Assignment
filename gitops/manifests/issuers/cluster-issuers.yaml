# Self-signed ClusterIssuer for the private zone.
# Public ACME is deliberately not used: corp.example.internal is not a
# publicly resolvable domain, so Let's Encrypt DNS-01 would never complete.
# See docs/adr/0002-dns-topology.md.
#
# Namespace note: kOps installs cert-manager into kube-system (not the
# conventional cert-manager namespace). A ClusterIssuer's CA secret must live
# in the same namespace as the controller, so the Certificate below targets
# kube-system.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-root
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-ca
  namespace: kube-system
spec:
  isCA: true
  commonName: platform-dev-ca
  secretName: platform-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-root
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: platform-ca
spec:
  ca:
    secretName: platform-ca
