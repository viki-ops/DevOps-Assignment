# Self-signed ClusterIssuer for the private zone.
# Public ACME is deliberately not used: corp.example.internal is not a
# publicly resolvable domain, so Let's Encrypt DNS-01 would never complete.
# See docs/adr/0002-dns-topology.md.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-root
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: platform-dev-ca
  secretName: platform-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-root
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: platform-ca
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ca:
    secretName: platform-ca
