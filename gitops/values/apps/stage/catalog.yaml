# Dev overrides for catalog.
replicaCount: 2

image:
  repository: public.ecr.aws/aws-containers/retail-store-sample-catalog
  digest: sha256:2c43d38525607aacffd298515068536736da8c2079da400bdeee5326c982d54c
  tag: "1.6.2-amd64"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1
  maxUnavailable: null

nodeSelector:
  lifecycle: on-demand
