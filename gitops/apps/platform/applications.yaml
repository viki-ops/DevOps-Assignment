# Wave -1: CRD-bearing controllers that everything else depends on.
# Wave  0: ingress, DNS, autoscaling, policy.
# Wave  1: observability (see apps/platform/observability/).
# Wave  2: application workloads (see apps/dev/).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://aws.github.io/eks-charts
      chart: aws-load-balancer-controller
      targetRevision: 3.5.0
      helm:
        valueFiles:
          - $values/gitops/values/platform/aws-load-balancer-controller.yaml
    - repoURL: https://github.com/viki-ops/DevOps-Assignment.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
