apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: retail-ui-stage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: stage
  sources:
    - repoURL: https://github.com/viki-ops/DevOps-Assignment.git
      targetRevision: main
      path: apps/charts/ui
      helm:
        valueFiles:
          - $values/gitops/values/apps/stage/ui.yaml
        releaseName: ui
    - repoURL: https://github.com/viki-ops/DevOps-Assignment.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: retail-store-stage
  # Manual sync is the promotion gate: a merge alone does not deploy.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
